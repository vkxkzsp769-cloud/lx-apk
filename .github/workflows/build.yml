name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 创建 Release 需要写权限（新仓库默认只读，不加会 403:
# Resource not accessible by integration）
permissions:
  contents: write

env:
  # 全局 Java 17：用 Java 11 跑 sdkmanager 会报
  # UnsupportedClassVersionError (class file 61.0 > 55.0)
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev \
            libssl-dev automake build-essential ccache lld
          java -version

      - name: 安装 buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install "buildozer==1.5.0" "cython<3.0" virtualenv

      - name: 缓存 Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: android-sdk-ndk-r25b-v4
          restore-keys: |
            android-sdk-ndk-r25b-

      # ── 待办：固定签名密钥 ──────────────────────────────
      # 目的：让每次构建用同一把钥匙签名，APK 才能覆盖安装
      # （不修的话每个版本签名都不同，Android 只允许「先卸载再装」）。
      #
      # 已完成：固定密钥已生成为仓库 Secret `DEBUG_KEYSTORE_B64`
      #         （PKCS12，别名 androiddebugkey / 口令 android）。
      # 未完成：把它还原到 ~/.android/debug.keystore 的这一步会让
      #         workflow 变成 startup_failure（一个 job 都不启动）——
      #         本机 YAML 解析通过，是 GitHub 侧语义校验拦的，原因待查。
      #         为避免构建继续挂在坏状态，暂时把这步撤掉。
      # 下一步：定位该校验规则后再加回来；在那之前构建恢复原状。

      - name: 预装 Android SDK
        env:
          PATH: /usr/lib/jvm/java-17-openjdk-amd64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"
          # buildozer 1.5.0 硬编码去找 tools/bin/sdkmanager（android.py:246），
          # 而新版 cmdline-tools 装在 cmdline-tools/latest/bin/，
          # 所以必须软链一份到老路径，否则报 sdkmanager path does not exist
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            rm -rf /tmp/cmdtools /tmp/cmdtools.zip
            curl -sSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKM"
          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDKM" "$SDK/tools/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKM" --sdk_root="$SDK" \
            "platform-tools" "build-tools;33.0.2" "platforms;android-33" || true
          ls "$SDK/build-tools" 2>/dev/null || echo "警告: 无 build-tools"
          test -x "$SDK/tools/bin/sdkmanager" && echo "✓ sdkmanager 老路径就绪"

      - name: 补丁 AndroidManifest（开启明文 HTTP + 旧版存储）
        run: |
          # 背景：
          #  buildozer 1.5.0 的 android.extra_manifest_application_arguments
          #  会给内容套字面双引号并把内部引号转义成 \" ，经 sh 直传（不走
          #  shell 解析）后原样进 XML，产生 \" 导致 ManifestMerger
          #  报 Error parsing AndroidManifest.xml（实测）。
          #
          #  音源含 11 个 http:// 主机，targetSdk>=28 默认禁明文，
          #  WebView 宿主用 XMLHttpRequest 取直链会被拦。
          #
          # 做法：把补丁打到「所有」可能出现的位置：
          #   a) p4a 源码树里的 AndroidManifest.tmpl.xml
          #   b) dist 内可能存在的模板副本
          #   c) 已渲染出来的 AndroidManifest.xml
          # 因为 p4a 在 create 时会把模板复制进 dist，之后从 dist 的副本渲染，
          # 只改源码树里的模板不生效（实测）。
          # 注意：不要删 dist 强制重渲染 —— 会触发 p4a 构建 venv 里 pip 的
          #      ImportError: BuildDependencyInstallError，create 直接失败。
          cat > /tmp/patch_manifest.py <<'PYEOF'
          import io, sys

          ATTRS = ('android:usesCleartextTraffic="true" '
                   'android:requestLegacyExternalStorage="true" ')

          def patch_template(path):
              src = io.open(path, encoding='utf-8').read()
              if 'usesCleartextTraffic' in src:
                  return 'skip'
              anchor = 'android:hardwareAccelerated="true"'
              if anchor not in src:
                  return 'no-anchor'
              src = src.replace(anchor, anchor + '\n                 ' +
                                ATTRS.strip(), 1)
              io.open(path, 'w', encoding='utf-8').write(src)
              return 'patched'

          def patch_manifest(path):
              src = io.open(path, encoding='utf-8').read()
              if 'usesCleartextTraffic' in src:
                  return 'skip'
              if '<application ' not in src:
                  return 'no-app-tag'
              src = src.replace('<application ', '<application ' + ATTRS, 1)
              io.open(path, 'w', encoding='utf-8').write(src)
              return 'patched'

          kind, path = sys.argv[1], sys.argv[2]
          fn = patch_template if kind == 'tmpl' else patch_manifest
          try:
              print('%-9s %-8s %s' % (fn(path), kind, path))
          except Exception as e:
              print('ERROR     %-8s %s (%s)' % (kind, path, e))
          PYEOF

          echo "=== a/b) 所有 manifest 模板 ==="
          find .buildozer -name 'AndroidManifest.tmpl.xml' -print0 2>/dev/null \
            | while IFS= read -r -d '' T; do
                python3 /tmp/patch_manifest.py tmpl "$T"
              done

          echo "=== c) 已渲染的 manifest ==="
          find .buildozer -path '*dists/lxdownloader/src/main/AndroidManifest.xml' \
               -print0 2>/dev/null \
            | while IFS= read -r -d '' M; do
                python3 /tmp/patch_manifest.py manifest "$M"
              done
          echo "=== 补丁完成 ==="

      - name: 编译 APK
        run: |
          # 注意：不要用 `yes | buildozer`。buildozer 正常跑完后 yes 仍写入，
          # 触发 SIGPIPE 让管道返回 1，步骤被判失败（尽管 APK 已生成）。
          set +e
          buildozer -v android debug > build.log 2>&1
          RC=$?
          tail -50 build.log
          echo "buildozer 退出码: $RC"
          # 生成 APK 即算成功（buildozer 有时因无关警告返回非 0）
          if ls bin/*.apk >/dev/null 2>&1; then
            echo "✓ 找到 APK: $(ls -lh bin/*.apk)"
            exit 0
          fi
          exit $RC

      - name: 失败时打印错误摘要
        if: failure()
        run: |
          echo "=========== 错误摘要 ==========="
          grep -aiE "error|Traceback|Exception|No such file|IndexError|not found|Command failed" build.log \
            | grep -avE "\[DEBUG\]|-Werror|-Wno-|error\.h|_error|checking |test_.*\.py" | tail -40 || true
          echo "=========== Traceback 上下文 ==========="
          grep -a -B15 "Traceback" build.log | grep -av "\[DEBUG\]" | tail -25 || true

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 自动发布到 Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 构建产物直接在 runner 上发布，不需要任何人把 APK 下载回来
          VER=$(grep -E '^version *=' buildozer.spec | head -1 | sed 's/.*= *//' | tr -d ' ')
          TAG="v$VER"
          APK=$(ls bin/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::没找到 APK，无法发布"; exit 1
          fi
          echo "版本: $VER   标签: $TAG   文件: $APK"

          # 重命名成不带 -debug 的正式名字
          OUT="lxdownloader-$VER-arm64-v8a.apk"
          cp "$APK" "$OUT"

          NOTES="自动构建发布（版本 $VER）。

          - 下载 $OUT 安装即可
          - 仅支持 arm64-v8a（2017 年后的手机基本都是）
          - 详细说明见仓库 README 与 编译APK说明.md
          - 提交: $GITHUB_SHA"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传"
            gh release upload "$TAG" "$OUT" --clobber
          else
            gh release create "$TAG" "$OUT" \
              --title "落雪音源下载器 $TAG" \
              --notes "$NOTES"
          fi
          echo "✓ 已发布: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lx-downloader-apk
          path: bin/*.apk
          if-no-files-found: error
