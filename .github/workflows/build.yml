name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # 全局 Java 17：用 Java 11 跑 sdkmanager 会报
  # UnsupportedClassVersionError (class file 61.0 > 55.0)
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev \
            libssl-dev automake build-essential ccache lld
          java -version

      - name: 安装 buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install "buildozer==1.5.0" "cython<3.0" virtualenv

      - name: 缓存 Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: android-sdk-ndk-r25b-v4
          restore-keys: |
            android-sdk-ndk-r25b-

      - name: 预装 Android SDK
        env:
          PATH: /usr/lib/jvm/java-17-openjdk-amd64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"
          # buildozer 1.5.0 硬编码去找 tools/bin/sdkmanager（android.py:246），
          # 而新版 cmdline-tools 装在 cmdline-tools/latest/bin/，
          # 所以必须软链一份到老路径，否则报 sdkmanager path does not exist
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            rm -rf /tmp/cmdtools /tmp/cmdtools.zip
            curl -sSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKM"
          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDKM" "$SDK/tools/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKM" --sdk_root="$SDK" \
            "platform-tools" "build-tools;33.0.2" "platforms;android-33" || true
          ls "$SDK/build-tools" 2>/dev/null || echo "警告: 无 build-tools"
          test -x "$SDK/tools/bin/sdkmanager" && echo "✓ sdkmanager 老路径就绪"

      - name: 补丁 AndroidManifest 模板（开启明文 HTTP + 旧版存储）
        run: |
          # buildozer 1.5.0 的 android.extra_manifest_application_arguments
          # 会给内容套字面双引号并转义内部引号，经 sh 直传后原样进 XML，
          # 产生 \" 导致 ManifestMerger 解析失败。
          # 因此直接给 p4a 的 AndroidManifest 模板打补丁。
          #
          # 音源含 11 个 http:// 主机，targetSdk>=28 默认禁明文，
          # WebView 里宿主用 XMLHttpRequest 取直链会被拦掉。
          P4A="$PWD/.buildozer/android/platform/python-for-android"
          if [ ! -d "$P4A" ]; then
            echo "p4a 不存在，先克隆 master（buildozer 默认分支）"
            git clone -b master --single-branch --depth 1 \
              https://github.com/kivy/python-for-android.git "$P4A"
          fi
          TMPL="$P4A/pythonforandroid/bootstraps/_sdl_common/build/templates/AndroidManifest.tmpl.xml"
          if [ ! -f "$TMPL" ]; then
            echo "::error::找不到 manifest 模板: $TMPL"; exit 1
          fi
          python3 - "$TMPL" <<'PYEOF'
          import io, sys
          path = sys.argv[1]
          src = io.open(path, encoding='utf-8').read()
          if 'usesCleartextTraffic' in src:
              print('模板已有 usesCleartextTraffic，跳过')
          else:
              anchor = 'android:hardwareAccelerated="true"'
              if anchor not in src:
                  print('::error::模板缺少锚点，无法打补丁'); sys.exit(1)
              add = (anchor +
                     '\n                 android:usesCleartextTraffic="true"' +
                     '\n                 android:requestLegacyExternalStorage="true"')
              src = src.replace(anchor, add, 1)
              io.open(path, 'w', encoding='utf-8').write(src)
              print('已打补丁')
          PYEOF
          echo "=== 确认补丁生效 ==="
          grep -n "usesCleartextTraffic\|requestLegacyExternalStorage" "$TMPL"

          # 关键：模板只在 p4a 的 create 步骤渲染。
          # 若 dist 已存在（缓存命中），create 会被跳过 ——
          # 实测此时权限会就地更新，但模板改动不会生效。
          # 所以必须删掉旧 dist，强制重新渲染 manifest。
          for d in .buildozer/android/platform/build-*/dists/lxdownloader; do
            if [ -d "$d" ]; then
              echo "删除旧 dist 以强制重渲染 manifest: $d"
              rm -rf "$d"
            fi
          done
          echo "dist 清理完成"

      - name: 编译 APK
        run: |
          # 注意：不要用 `yes | buildozer`。buildozer 正常跑完后 yes 仍写入，
          # 触发 SIGPIPE 让管道返回 1，步骤被判失败（尽管 APK 已生成）。
          set +e
          buildozer -v android debug > build.log 2>&1
          RC=$?
          tail -50 build.log
          echo "buildozer 退出码: $RC"
          # 生成 APK 即算成功（buildozer 有时因无关警告返回非 0）
          if ls bin/*.apk >/dev/null 2>&1; then
            echo "✓ 找到 APK: $(ls -lh bin/*.apk)"
            exit 0
          fi
          exit $RC

      - name: 失败时打印错误摘要
        if: failure()
        run: |
          echo "=========== 错误摘要 ==========="
          grep -aiE "error|Traceback|Exception|No such file|IndexError|not found|Command failed" build.log \
            | grep -avE "\[DEBUG\]|-Werror|-Wno-|error\.h|_error|checking |test_.*\.py" | tail -40 || true
          echo "=========== Traceback 上下文 ==========="
          grep -a -B15 "Traceback" build.log | grep -av "\[DEBUG\]" | tail -25 || true

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lx-downloader-apk
          path: bin/*.apk
          if-no-files-found: error
