name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 创建 Release 需要写权限（新仓库默认只读，不加会 403:
# Resource not accessible by integration）
permissions:
  contents: write

env:
  # 全局 Java 17：用 Java 11 跑 sdkmanager 会报
  # UnsupportedClassVersionError (class file 61.0 > 55.0)
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev \
            libssl-dev automake build-essential ccache lld
          java -version

      - name: 安装 buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install "buildozer==1.5.0" "cython<3.0" virtualenv

      - name: 缓存 Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: android-sdk-ndk-r25b-v4
          restore-keys: |
            android-sdk-ndk-r25b-

      # ── 待办：固定签名密钥 ──────────────────────────────
      # 目的：让每次构建用同一把钥匙签名，APK 才能覆盖安装
      # （不修的话每个版本签名都不同，Android 只允许「先卸载再装」）。
      #
      # 已完成：固定密钥已生成为仓库 Secret `DEBUG_KEYSTORE_B64`
      #         （PKCS12，别名 androiddebugkey / 口令 android）。
      # 未完成：把它还原到 ~/.android/debug.keystore 的这一步会让
      #         workflow 变成 startup_failure（一个 job 都不启动）——
      #         本机 YAML 解析通过，是 GitHub 侧语义校验拦的，原因待查。
      #         为避免构建继续挂在坏状态，暂时把这步撤掉。
      # 下一步：定位该校验规则后再加回来；在那之前构建恢复原状。

      - name: 预装 Android SDK
        env:
          PATH: /usr/lib/jvm/java-17-openjdk-amd64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"
          # buildozer 1.5.0 硬编码去找 tools/bin/sdkmanager（android.py:246），
          # 而新版 cmdline-tools 装在 cmdline-tools/latest/bin/，
          # 所以必须软链一份到老路径，否则报 sdkmanager path does not exist
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            rm -rf /tmp/cmdtools /tmp/cmdtools.zip
            curl -sSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKM"
          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDKM" "$SDK/tools/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKM" --sdk_root="$SDK" \
            "platform-tools" "build-tools;33.0.2" "platforms;android-33" || true
          ls "$SDK/build-tools" 2>/dev/null || echo "警告: 无 build-tools"
          test -x "$SDK/tools/bin/sdkmanager" && echo "✓ sdkmanager 老路径就绪"

      - name: 补丁 AndroidManifest（开启明文 HTTP + 旧版存储）
        run: |
          # 背景：
          #  buildozer 1.5.0 的 android.extra_manifest_application_arguments
          #  会给内容套字面双引号并把内部引号转义成 \" ，经 sh 直传（不走
          #  shell 解析）后原样进 XML，产生 \" 导致 ManifestMerger
          #  报 Error parsing AndroidManifest.xml（实测）。
          #
          #  音源含 11 个 http:// 主机，targetSdk>=28 默认禁明文，
          #  WebView 宿主用 XMLHttpRequest 取直链会被拦。
          #
          # 做法：把补丁打到「所有」可能出现的位置：
          #   a) p4a 源码树里的 AndroidManifest.tmpl.xml
          #   b) dist 内可能存在的模板副本
          #   c) 已渲染出来的 AndroidManifest.xml
          # 因为 p4a 在 create 时会把模板复制进 dist，之后从 dist 的副本渲染，
          # 只改源码树里的模板不生效（实测）。
          # 注意：不要删 dist 强制重渲染 —— 会触发 p4a 构建 venv 里 pip 的
          #      ImportError: BuildDependencyInstallError，create 直接失败。
          cat > /tmp/patch_manifest.py <<'PYEOF'
          import io, sys

          # 需要补进 <application> 的属性。逐个判断 —— 只判其中一个的话，
          # 老版本已经打过 usesCleartextTraffic 的缓存 manifest 会被整段跳过，
          # 新加的 extractNativeLibs 就永远打不上（libmp3slim.so 加载不到）。
          ATTRS = [
              ('usesCleartextTraffic', 'android:usesCleartextTraffic="true"'),
              ('requestLegacyExternalStorage',
               'android:requestLegacyExternalStorage="true"'),
              # extractNativeLibs=true：p4a 新版默认声明成 false（.so 留在
              # apk 里直接 mmap）。我们 load 的 libmp3slim.so 是 ctypes dlopen，
              # 解到 nativeLibraryDir 的真文件最稳（详见 mp3slim.py 的注释）。
              ('extractNativeLibs', 'android:extractNativeLibs="true"'),
          ]

          def missing(src):
              return [a for key, a in ATTRS if key not in src]

          def patch_template(path):
              src = io.open(path, encoding='utf-8').read()
              need = missing(src)
              if not need:
                  return 'skip'
              anchor = 'android:hardwareAccelerated="true"'
              if anchor not in src:
                  return 'no-anchor'
              src = src.replace(anchor, anchor + '\n                 ' +
                                ' '.join(need), 1)
              io.open(path, 'w', encoding='utf-8').write(src)
              return 'patched(%d)' % len(need)

          def patch_manifest(path):
              src = io.open(path, encoding='utf-8').read()
              need = missing(src)
              if not need:
                  return 'skip'
              if '<application ' not in src:
                  return 'no-app-tag'
              src = src.replace('<application ', '<application ' +
                                ' '.join(need) + ' ', 1)
              io.open(path, 'w', encoding='utf-8').write(src)
              return 'patched(%d)' % len(need)

          kind, path = sys.argv[1], sys.argv[2]
          fn = patch_template if kind == 'tmpl' else patch_manifest
          try:
              print('%-9s %-8s %s' % (fn(path), kind, path))
          except Exception as e:
              print('ERROR     %-8s %s (%s)' % (kind, path, e))
          PYEOF

          echo "=== a/b) 所有 manifest 模板 ==="
          find .buildozer -name 'AndroidManifest.tmpl.xml' -print0 2>/dev/null \
            | while IFS= read -r -d '' T; do
                python3 /tmp/patch_manifest.py tmpl "$T"
              done

          echo "=== c) 已渲染的 manifest ==="
          find .buildozer -path '*dists/lxdownloader/src/main/AndroidManifest.xml' \
               -print0 2>/dev/null \
            | while IFS= read -r -d '' M; do
                python3 /tmp/patch_manifest.py manifest "$M"
              done
          echo "=== 补丁完成 ==="

      - name: 编译 native 引擎 + 跑引擎测试
        run: |
          # ── 为什么在这里单独编一遍 libmp3slim.so ────────────────────
          # p4a 编译 APK 时也会用 NDK 编译它（recipes/mp3slimcore）。
          # 但那是十几分钟之后的事，而且一旦失败，日志埋在几千行
          # buildozer 输出里，很难看出来**究竟**是 native 的问题还是
          # p4a 的问题。这里先用宿主机 clang 快速编一份 **x86_64 版**
          # 来跑引擎测试（解码/编码/重采样逻辑与架构无关），
          # 3 秒出结果 —— 真有问题在这里就红，不浪费一次 20 分钟的编译。
          set -e
          sudo apt-get install -y clang > /dev/null 2>&1 || true
          echo "=== 编译 libmp3slim.so（宿主机 x86_64，仅供测试） ==="
          clang -O2 -fPIC -shared -DHAVE_CONFIG_H \
            -Inative/mp3slim \
            -Inative/mp3slim/codec/lame \
            -Inative/mp3slim/codec/lame/vector \
            -o /tmp/libmp3slim.so \
            native/mp3slim/mp3slim_core.c \
            $(ls native/mp3slim/codec/lame/*.c | grep -v mpglib_interface) \
            -lm
          ls -lh /tmp/libmp3slim.so

          echo "=== 生成测试用 MP3（ffmpeg 合成，不依赖外部素材） ==="
          sudo apt-get install -y ffmpeg > /dev/null 2>&1 || true
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=440:duration=12" \
            -f lavfi -i "sine=frequency=660:duration=12" \
            -filter_complex "[0:a][1:a]amerge=inputs=2[a]" -map "[a]" \
            -c:a libmp3lame -b:a 320k /tmp/testcase.mp3
          ls -lh /tmp/testcase.mp3

          echo "=== 引擎测试 ==="
          MP3SLIM_LIB=/tmp/libmp3slim.so MP3SLIM_SAMPLE=/tmp/testcase.mp3 \
            python3 test_mp3slim.py

      - name: 跑界面冒烟测试
        run: |
          # test_ui.py 用 SDL offscreen 在没有显示器的机器上真跑 Kivy 界面。
          # 它挡的是「启动即崩」「控件漏接」「线程契约被破坏」这类事故 ——
          # 这些在真机上表现为闪退，在这里是几秒的测试。
          #
          # 注意几次踩坑（都让这一步「8 秒就红、日志一片空白」）：
          #   1. 不加 set -x / 不把 pip 的输出打出来，失败时完全看不到原因；
          #   2. kivy 有 cp310 manylinux wheel，但**必须** --only-binary，
          #      否则 pip 会去下 sdist 现场编译（缺 GL 头文件直接失败）；
          #   3. 管道会吃掉退出码，得用 pipefail。
          set -o pipefail
          sudo apt-get install -y -qq libsdl2-2.0-0 libsdl2-image-2.0-0 \
            libsdl2-mixer-2.0-0 libsdl2-ttf-2.0-0 || echo "（SDL 包安装失败，继续）"

          echo "=== 安装 Kivy ==="
          python3 -m pip install --only-binary=:all: "kivy==2.3.1" pyflakes
          python3 -c "import kivy; print('kivy', kivy.__version__)"

          echo "=== 环境自检 ==="
          # Kivy 在 CI 上起窗口时，缺 SDL/GL 库的表现是
          # 「logger.critical + sys.exit(1)」——如果这时日志被关掉，
          # 就只能看到「进程 exit 1、零输出」，完全无从排查。
          # 所以这里先把关键库与运行时信息打出来。
          # 注意：这里**不要**用 `python3 - <<EOF` 的 heredoc —— YAML 块里
          # heredoc 的结束符必须顶格，而这一步整体又要缩进 10 格，
          # 两者冲突，很容易把 YAML 弄坏。写成 -c 一行更稳。
          python3 -c "
          import ctypes, os, sys
          print('python:', sys.version.split()[0])
          print('SDL_VIDEODRIVER:', os.environ.get('SDL_VIDEODRIVER'))
          for lib in ('libSDL2-2.0.so.0', 'libSDL2_ttf-2.0.so.0',
                      'libSDL2_image-2.0.so.0', 'libSDL2_mixer-2.0.so.0',
                      'libGL.so.1', 'libEGL.so.1'):
              try:
                  ctypes.CDLL(lib)
                  print('  %-24s OK' % lib)
              except OSError as e:
                  print('  %-24s 缺失 (%s)' % (lib, str(e)[:60]))
          " || true

          echo "=== 跑测试 ==="
          # tee 到文件：这一步失败时 GitHub 只显示 "exit code 1"，
          # 之前就是因为没有日志文件而完全不知道发生了什么。
          set +e
          # KIVY_NO_CONSOLELOG=0：让 Kivy 自己的 CRITICAL/ERROR 打出来。
          # 没有它的话，「窗口起不来」只是一个静默的 exit 1。
          KIVY_NO_CONSOLELOG=0 SDL_VIDEODRIVER=offscreen \
            python3 -u test_ui.py 2>&1 | tee test-ui.log
          RC=${PIPESTATUS[0]}
          echo "test_ui 退出码: $RC"
          echo "--- test-ui.log 里失败的项 ---"
          grep -E "\[FAIL\]|✗|CRITICAL|FATAL" test-ui.log || true
          exit $RC

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            build.log
            test-ui.log
          if-no-files-found: ignore

      - name: 编译 APK
        run: |
          # ---- 固定签名密钥：让每个版本的 APK 签名一致，才能覆盖安装 ----
          # 密钥随仓库走（signing/keystore.b64），不依赖 Secret。
          # 必须走 release 构建：只有 release 才用 p4a 的 P4A_RELEASE_*
          # 这套显式密钥（见 p4a 源码 pythonforandroid/build.py 里
          # --keystore/--signkey/--keystorepw/--signkeypw 的映射）。
          # debug 构建用的是 AGP 自动生成的 debug 钥匙，CI 每次全新环境都会
          # 重新生成 —— 实测两次构建的 CERT.RSA sha256 不同、连长度都不同
          # （1019B vs 1015B），Android 因此只允许先卸载再装。
          KS="$RUNNER_TEMP/lx-sign.keystore"
          base64 -d signing/keystore.b64 > "$KS"
          export P4A_RELEASE_KEYSTORE="$KS"
          export P4A_RELEASE_KEYALIAS=lxsign
          export P4A_RELEASE_KEYSTORE_PASSWD=android
          export P4A_RELEASE_KEYALIAS_PASSWD=android
          keytool -list -keystore "$KS" -storepass android -alias lxsign | tail -3

          # 注意：不要用 `yes | buildozer`。buildozer 正常跑完后 yes 仍写入，
          # 触发 SIGPIPE 让管道返回 1，步骤被判失败（尽管 APK 已生成）。
          set +e
          buildozer -v android release > build.log 2>&1
          RC=$?
          tail -50 build.log
          echo "buildozer 退出码: $RC"
          # 生成 APK 即算成功（buildozer 有时因无关警告返回非 0）
          if ls bin/*.apk >/dev/null 2>&1; then
            echo "✓ 找到 APK: $(ls -lh bin/*.apk)"
            exit 0
          fi
          exit $RC

      - name: 失败时打印错误摘要
        if: failure()
        run: |
          echo "=========== 错误摘要 ==========="
          grep -aiE "error|Traceback|Exception|No such file|IndexError|not found|Command failed" build.log \
            | grep -avE "\[DEBUG\]|-Werror|-Wno-|error\.h|_error|checking |test_.*\.py" | tail -40 || true
          echo "=========== Traceback 上下文 ==========="
          grep -a -B15 "Traceback" build.log | grep -av "\[DEBUG\]" | tail -25 || true

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 自动发布到 Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 构建产物直接在 runner 上发布，不需要任何人把 APK 下载回来
          VER=$(grep -E '^version *=' buildozer.spec | head -1 | sed 's/.*= *//' | tr -d ' ')
          TAG="v$VER"
          APK=$(ls bin/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::没找到 APK，无法发布"; exit 1
          fi
          echo "版本: $VER   标签: $TAG   文件: $APK"

          # 重命名成不带 -debug 的正式名字
          OUT="lxdownloader-$VER-arm64-v8a.apk"
          cp "$APK" "$OUT"

          NOTES="自动构建发布（版本 $VER）。

          - 下载 $OUT 安装即可
          - 仅支持 arm64-v8a（2017 年后的手机基本都是）
          - 详细说明见仓库 README 与 编译APK说明.md
          - 提交: $GITHUB_SHA"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传"
            gh release upload "$TAG" "$OUT" --clobber
          else
            gh release create "$TAG" "$OUT" \
              --title "落雪音源下载器 $TAG" \
              --notes "$NOTES"
          fi
          echo "✓ 已发布: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lx-downloader-apk
          path: bin/*.apk
          if-no-files-found: error
