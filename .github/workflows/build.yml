name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev \
            libssl-dev automake build-essential ccache lld

      - name: 安装 buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install "buildozer==1.5.0" "cython<3.0" virtualenv

      - name: 缓存 Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v2-${{ runner.os }}-

      - name: 确保 Android build-tools 已安装
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          if [ ! -d "$SDK/build-tools" ]; then
            echo "build-tools 缺失，手动安装..."
            mkdir -p "$SDK/cmdline-tools"
            if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
              curl -sSL -o /tmp/cmdtools.zip \
                https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
              mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
            fi
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              --sdk_root="$SDK" "build-tools;33.0.2" "platforms;android-33" || true
          fi
          ls "$SDK/build-tools" 2>/dev/null || echo "警告: build-tools 仍不可用"

      - name: 编译 APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: 失败时打印错误摘要
        if: failure()
        run: |
          echo "=========== 编译失败，错误摘要 ==========="
          grep -aiE "error|Traceback|Exception|No such file|failed|not found|IndexError" build.log \
            | grep -avE "\[DEBUG\]|-Werror|-Wno-|error\.h|_error|checking " | tail -50 || true
          echo "=========== Traceback 上下文 ==========="
          grep -a -B15 "Traceback" build.log | grep -av "\[DEBUG\]" | tail -30 || true

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lx-downloader-apk
          path: bin/*.apk
          if-no-files-found: error
