name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # 关键：全局设成 Java 17，否则 sdkmanager 会报
  # UnsupportedClassVersionError (class file version 61.0 > 55.0)
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev \
            libssl-dev automake build-essential ccache lld
          java -version

      - name: 安装 buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install "buildozer==1.5.0" "cython<3.0" virtualenv

      - name: 缓存 Android SDK/NDK（命中后能省 10 分钟）
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: android-sdk-ndk-r25b-v4
          restore-keys: |
            android-sdk-ndk-r25b-

      - name: 预装 Android SDK（build-tools + platform-tools）
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          PATH: /usr/lib/jvm/java-17-openjdk-amd64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"

          # buildozer 1.5.0 会去找「老式」的 tools/bin/sdkmanager，
          # 而新版 cmdline-tools 装在 cmdline-tools/latest/bin/。
          # 所以这里两个位置都放一份，避免它报 does not exist。
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "== 下载 cmdline-tools =="
            rm -rf /tmp/cmdtools /tmp/cmdtools.zip
            curl -sSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKM"

          # 兼容老路径：软链到 tools/bin/sdkmanager
          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDKM" "$SDK/tools/bin/sdkmanager"

          echo "== 接受许可 =="
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true

          echo "== 安装所需包 =="
          "$SDKM" --sdk_root="$SDK" \
            "platform-tools" "build-tools;33.0.2" "platforms;android-33" || true

          echo "== 校验 =="
          ls "$SDK/build-tools" 2>/dev/null || echo "警告: 无 build-tools"
          ls "$SDK/platform-tools" 2>/dev/null | head -3 || echo "警告: 无 platform-tools"
          test -x "$SDK/tools/bin/sdkmanager" && echo "✓ sdkmanager 老路径已就绪"

      - name: 编译 APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          # 注意：不要用 `yes | buildozer`。buildozer 正常跑完后 yes 仍会写入，
          # 触发 SIGPIPE 让整条管道返回 1，步骤被判失败（尽管 APK 已生成）。
          # 许可问题已在「预装 Android SDK」步骤里处理掉了。
          set +e
          buildozer -v android debug > build.log 2>&1
          RC=$?
          tail -40 build.log
          echo "buildozer 退出码: $RC"
          # APK 生成了就算成功（buildozer 有时会因无关警告返回非 0）
          if ls bin/*.apk >/dev/null 2>&1; then
            echo "✓ 找到 APK: $(ls -lh bin/*.apk)"
            exit 0
          fi
          exit $RC

      - name: 失败时打印错误摘要
        if: failure()
        run: |
          echo "=========== 错误摘要 ==========="
          grep -aiE "error|Traceback|Exception|No such file|IndexError|not found" build.log \
            | grep -avE "\[DEBUG\]|-Werror|-Wno-|error\.h|_error|checking " | tail -40 || true
          echo "=========== Traceback 上下文 ==========="
          grep -a -B15 "Traceback" build.log | grep -av "\[DEBUG\]" | tail -25 || true

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lx-downloader-apk
          path: bin/*.apk
          if-no-files-found: error
